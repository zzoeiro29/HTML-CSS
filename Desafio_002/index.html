<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tags html</title>
</head>
<body>
    <h1>Tags em html</h1>
    <p>Em html podemos usar varias tags. Passe o mouse em cima para saber os seus significados:</p>
    <ul>
        <li><abbr title="Tag p">Paragrafo</abbr></li>
        <li><abbr title="Tag de h1 a h6">Titulos</abbr></li>
        <li><abbr title="Tag img">Imagens</abbr></li>
        <li><abbr title="Tag abbr">Abreviaçoes</abbr></li>
        <li><abbr title="Tag code">Codigo fonte</abbr></li>
        <li><abbr title="Tag ol e li">Listas numeradas</abbr></li>
        <li><abbr title="Tag ul e li">Listas desmarcadas</abbr></li>
    </ul>
    
</body>
</html>
