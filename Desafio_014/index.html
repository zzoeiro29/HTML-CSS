<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio14</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        th{
            color: white;
            background-color: grey;
        }
        .cinza{
            background-color: grey;
            color: white;
        }
        .normal{
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Area</th>
                <th scope="col" rowspan="2">Disciplina</th>
                <th scope="colgroup" colspan="2"> Notas</th>
                <th scope="col" rowspan="2">Media</th>
            </tr>
            <tr>
                <th scope="col" >Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4" class="normal">Exatas</th>
                <td scope="row">matematica</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
            </tr>
            <tr>
                <td scope="row">fisica</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
            </tr>
            <tr>
                <td scope="row">quimica</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
            </tr>
            <tr>
                <td scope="row">biologia</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
            </tr>
            <tr>
                <th scope="row" colspan="4">Media exatas</th>
                <td scope="row" class="cinza">0</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <th scope="row" rowspan="2" class="normal">Humanas</th>
                <td scope="row">Historia</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
            </tr>
            <tr>
                 <td scope="row">Geografia</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
                <td scope="row">0</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row" colspan="4">Media de humanas</th>
            <td scope="row" class="cinza">0</td>
        </tfoot>
    </table>
</body>
</html>
