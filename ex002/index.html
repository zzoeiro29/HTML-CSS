<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <!-- O basico -->
    <h1>Paragrafos e quebras de linha</h1>
    <hr>
    <p>voce pode escrever um paragrafo de qualquer jeito, so colocando no meio do par e tags: &lt;p&gt; e &lt;p&gt;</p> <!-- LESS THAN / GREATER THAN-->
    <p>Se presisare quebrar o texto em algum lugar especifico <br> como esse, voce pode usar a tag &lt;br&gt;</p>
    <!-- emojis e simbolos-->
    <p> Vamos adicionar alguns simbolos especificos: </p>
      &reg;
      &copy;
    <p>Vamos adiconar emojis:</p>
      &#x1F940;
</body>
</html>
