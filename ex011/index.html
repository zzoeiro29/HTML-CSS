<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduzindo audio</title>
</head>
<body>
    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em html5</p>
    <!-- tag audio = para o audio-->
    <!-- tag autoplay = inicia o audio-->
    <!-- tag controls = é para por os controlos do audio-->
    <!--<audio src="Midia/“Você era meu irmão Anakin, eu amava você”😭.mp3" controls autoplay></audio>-->
    <!-- outra maneira-->
    <audio preload="metadata" autoplay controls>
        <!-- tag src = é pra audio-->
        <source src="Midia/“Você era meu irmão Anakin, eu amava você”😭.mp3" type="audio/mpeg">
        <source src="Midia/“Você era meu irmão Anakin, eu amava você”😭.mp3" type="audio/ogg">
        <source src="Midia/“Você era meu irmão Anakin, eu amava você”😭.mp3" type="audio/wav"> 
    </audio>
    <p>Se nao de clique aqui pra baixar o arquivo <a href="Midia/“Você era meu irmão Anakin, eu amava você”😭.mp3">Aperte para baixar</a></p>
</body>
</html>
