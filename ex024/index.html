<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peseudo class</title>
    <style>
        div{
            display: inline-block;  /* tudo na mesma linha */
            background-color: lightblue;
            border: 1px solid black; /* shorthand */
            text-align: center;
            height: 100px; /* height é altura*/
            width: 100px; /* 200px é largura */
        }

        /* peseudo class*/
        /* hover é que quando passar o mouse muda de estado */
        div:hover{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!-- div é um espaço, uma linha-->
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
