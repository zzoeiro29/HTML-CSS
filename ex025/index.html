<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-elementos
        > = children
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        /* pseudo classes */
        /* uma : os dois pontos */

        a:visited{ /* viseted é uma peseudo classe de a, ele faz como q se o link ja for visitado ou clicado ele faz oq o que estiver escrito no codigo*/
            color: darkred;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:active{ /* active é quando ele é clicado */
            color: yellow;
        }

         /* pseudo elementos */
         /* duas vezes os :: dois pontos */
        /*
        a::before{
            content: "=>";
        }


        a::after{  after é depois do link
            content: "<=";
            
         }
            */

        .especial{ 
            background-color: rgb(224, 121, 121);

        }
        .especial::before{ /* class com pseudo elementos */
            content: "=>";
        }

        .especial::after{ /* class com pseudo elementos */
            content: "<=";
        }

        
    </style>
</head>
<body>
    <h1>Personalizado links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank" class="especial">repositorio github</a></li> <!-- target ="_blank" abre uma nova janela-->
        <li><a href="https://www.youtube.com/@cursoemvideo" target="_blank">Canal do youtube</a></li>
        <li><a href="https://www.tiktok.com/@geladeira_09" target="_blank">Site de Cursoemvideo</a></li>
    </ul>
</html>
