<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulario</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="icor"> cor</label> 
            <input type="color" name="cor" id="icors" value="#00ff00"> <!-- type color muda a cor-->
        </p>
        <p>
            <label for="inivel"> Nivel de satisfaçao</label>
            <input type="range" name="nivel" id="inivel" min="1" max="5" value="2"> <!-- type range, faz uma barra de range; min e max neste caso faz pular de 1 ate 5-->
        <p>
            <label for="ifoto">Foto de perfil</label>
            <input type="file" name="foto" id="ifoto"> <!-- type file, faz um lugar para por um arquivo neste caso uma foto-->
        </p>
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
