<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse; /* border-collapse: separate; padrao é separado separa as linhas da tabela; mas collapse poe as tabelas juntas */
        }
        td{
            border: 1px solid black; /* borda da tabela */
            padding: 8px;
            text-align: center; /* alinhamento horizontal */
            vertical-align: middle;  /* alinhamento vertical */
        }

        .numero{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- hieraquia de tabelas (simples)
     table = tabela
        table  row = linha da tabela
            table header = cabeçalho de tabela
            table data = dado de tabela
    
    -->
    <table>
        <!--primeira linha -->
        <tr>  <!--tr = linha da tabela -->
            <td>A1  <!--td = dado de tabela -->
            <td>B1 <!-- /td nao é obrigatorio -->
            <td>C1
        </tr> 
        <tr>
            <td>A2</td>  <!--td = dado de tabela -->
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>  <!--td = dado de tabela -->
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
