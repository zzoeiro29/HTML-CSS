<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        /* css tem prioridade */
        iframe{
            width: 400px;
            height: 400px;
            border: 1px dashed black
        }
    </style>
</head>
<body>
    <!-- tem sites que nao funcionam em iframes (n é gunabara...)-->
    <h1>Testado o uso de um iframe</h1>
    <p>Acessando o site do 
        <!-- tamanho padrao 300x150-->
        <iframe src="https://pt.wikipedia.org/wiki/Wikip%C3%A9dia:P%C3%A1gina_principal" frameborder="0" height="500px" scolling="no"> <!-- scrolling n funciona-->
            <!-- caso o iframe nao pareça-->
            <a href="https://pt.wikipedia.org/wiki/Wikip%C3%A9dia:P%C3%A1gina_principal" target="_blank"> wikipedia</a>
        </iframe> <!-- iframe o i é de inline--> 
        <!-- frameborder é a borda do iframe so da 0 e 1 sim ou nao; src é o url-->
    para aprender a programar</p>

    <p>O site do 
    <iframe src="https://pt.wiktionary.org/wiki/Wikcion%C3%A1rio:P%C3%A1gina_principal" frameborder="0" height="500px" width="500px">
        no <a href="https://pt.wiktionary.org/wiki/Wikcion%C3%A1rio:P%C3%A1gina_principal" target="_blank"> aura?</a>
    </iframe>
        
    tambem é muito legal</p>
</body>
</html>
