<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on"> <!-- atuocomplete = completa automaticamente-->
        <p>
            <label for="iusu">Usuario</label> 
            <!-- minlength = minimo de letras; -->
            <!-- maxlength = maximos de letras; -->
            <!-- size = tamanho da caixa; -->
            <!-- paceholder = é uma ajuda na caixa, um texto fica quando nao esta nada escrito-->
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="10" placeholder="nome do usuario" autocomplete="username"> <!-- required é obrigatorio, o campo fica obrigatorio; -->
        </p>
        <p>
            <label for="isen">Senha</label> 
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" placeholder="senha" autocomplete="current-password">  <!-- type password, para passwords-->
        </p>
        <p>
            <input type="submit" value="Enviar">  <!-- type submit,eniva o formulario-->
            <input type="reset" value="limpar"> <!-- type reset , limpa o formulario-->
        </p>
    </form>
</body>
</html>
