<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo do formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset> <!-- o fieldset agrupa numa caixa o conteudo do formulario-->
            <legend>Dados pessoais</legend> <!-- legenda-->
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required> <!-- type email é para os emails (embora ele so verifique o @)-->
            </p>
            <p>
                <label for="itele">telemovel</label>
                <input type="tel" name="tel" id="itele" autocomplete="tel" pattern="\(\d{2}\)\d{4, 5}-\d{4}$" required placeholder="(xx)xxxxxxxxx">
            </p>
            <!-- estudar mais sobre RegEx-->
            <p>
        </fieldset>
        <br>
            <input type="submit" value="enviar"> 
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
