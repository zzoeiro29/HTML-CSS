<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <!-- type radio so deixa marcar uma opcao e o name tem que ser igual em todos os inputs-->
             <!-- checked faz com que so uma opçao ja venha marcada tem que ser no input-->
            <legend>Sexo uhh</legend>
            <input type="radio" name="sexo" id="isxmais"checked> <label for="isxmais">Masculino</label> <br>
            <input type="radio" name="sexo" id="isxfem" > <label for="isxfem">femenino</label>
        </fieldset>
        <fieldset>
            <legend> Esportes favoritos</legend>
            <!-- type checkbox faz o uma caixa para marcar varias opçoes-->
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">basquete</label> <br>
            <input type="checkbox" name="esfut" id="iesfut"checked> <label for="iesfut" >Futebol</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Nataçao</label> <br>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tenis</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
