<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media query</title>
    <!-- 

    media type = "" nao tem parentesis
    media features = () sao caracteristica
    -->
    <link rel="stylesheet" href="estilos/style.css" media="all"> <!-- media="all" vai servir pra todos os despositivos-->
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)"> <!-- vai mostrar todas as telas em modo retrato (ou em pe) -->
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)" > <!-- vai mostrar todas as telas em modo landscape (ou deitado) -->
</head>
<body>
    <h1>Mude a orientaçao do seu despositivo</h1>
    
</body>
</html>
